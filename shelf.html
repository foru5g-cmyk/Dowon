<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shelf.</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+KR:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0efeb;
  --paper: #faf9f6;
  --ink: #1a1917;
  --ink-mid: #43423a;
  --ink-soft: #7a7971;
  --ink-faint: #b0afa6;
  --border: #dcdbd1;
  --ribbon: #8f3a3a;
  --ribbon-dk: #6f2c2c;
  --gold: #a8834f;
  --shadow: rgba(26,25,23,0.10);
}
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Inter', sans-serif; min-height: 100vh;
}

/* ---------- header ---------- */
header {
  text-align: center; padding: 64px 24px 8px;
}
.logo {
  font-family: 'EB Garamond', serif; font-size: 22px; font-style: italic;
  letter-spacing: 0.04em; color: var(--ink);
}
.logo::after { content: ''; }
.tagline {
  margin-top: 10px; font-family: 'Noto Serif KR', serif; font-weight: 300;
  font-size: 12.5px; color: var(--ink-faint); letter-spacing: 0.01em;
}

/* ---------- grid ---------- */
.wrap { max-width: 940px; margin: 0 auto; padding: 40px 28px 100px; }

.toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-bottom: 16px; min-height: 16px; }
.toolbar-btn {
  background: none; border: none; cursor: pointer;
  font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.05em;
  color: var(--ink-faint); padding: 2px 2px; transition: color 0.15s;
}
.toolbar-btn:hover { color: var(--ink-mid); }
.toolbar-btn.danger { color: var(--ribbon); }
.toolbar-btn.danger:hover { color: var(--ribbon-dk); }
.toolbar-btn:disabled { opacity: 0.35; cursor: default; color: var(--ink-faint); }

.select-check {
  position: absolute; top: 8px; left: 8px; width: 19px; height: 19px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.9); background: rgba(26,25,23,0.28);
  display: flex; align-items: center; justify-content: center; z-index: 5;
  font-family: 'Inter', sans-serif; font-size: 11px; color: #fff; line-height: 1;
}
.select-check.checked { background: var(--ribbon); border-color: var(--ribbon); }
.cover.selecting { opacity: 0.92; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 26px 22px;
}
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px 14px; }
}

.card { display: flex; flex-direction: column; gap: 9px; }
.cover {
  position: relative; aspect-ratio: 3 / 4; border-radius: 3px;
  background: var(--paper); border: 0.5px solid var(--border);
  overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 2px var(--shadow), 0 8px 16px -10px var(--shadow);
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
.cover:hover {
  transform: translateY(-3px);
  box-shadow: 0 3px 6px var(--shadow), 0 16px 24px -12px var(--shadow);
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* signature: folded-corner bookmark ribbon */
.ribbon {
  position: absolute; top: 0; right: 14px; width: 15px; height: 40px;
  background: var(--ribbon);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
  box-shadow: -1px 1px 3px rgba(0,0,0,0.18);
}

.cap { padding: 0 2px; }
.cap-title {
  font-family: 'Noto Serif KR', serif; font-weight: 400; font-size: 12.5px;
  color: var(--ink-mid); line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  outline: none; cursor: text;
}
.cap-title:focus { color: var(--ink); border-bottom: 1px solid var(--border); }
.cap-date {
  font-family: 'Inter', sans-serif; font-size: 9.5px; letter-spacing: 0.04em;
  color: var(--ink-faint); margin-top: 2px;
}

/* add card */
.add-cover {
  aspect-ratio: 3 / 4; border-radius: 3px; border: 1px dashed var(--border);
  background: transparent; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color 0.18s, background 0.18s;
}
.add-cover:hover { border-color: var(--ink-faint); background: var(--paper); }
.add-plus { font-family: 'EB Garamond', serif; font-size: 30px; color: var(--ink-faint); font-weight: 400; }
.add-label {
  font-family: 'Inter', sans-serif; font-size: 10px; color: var(--ink-faint);
  letter-spacing: 0.04em; text-align: center;
}

/* ---------- uploading placeholder ---------- */
.uploading-cover {
  aspect-ratio: 3 / 4; border-radius: 3px; background: var(--paper);
  border: 0.5px solid var(--border); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 1px 2px var(--shadow);
}
.spinner {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--ink-faint);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.uploading-label {
  font-family: 'Inter', sans-serif; font-size: 9.5px; color: var(--ink-faint);
  letter-spacing: 0.04em; text-align: center; max-width: 90%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---------- empty state ---------- */
.empty {
  grid-column: 1 / -1; text-align: center; padding: 70px 20px;
  color: var(--ink-faint);
}
.empty-glyph { font-family: 'EB Garamond', serif; font-size: 34px; font-style: italic; margin-bottom: 10px; }
.empty-text { font-family: 'Noto Serif KR', serif; font-weight: 300; font-size: 13px; }

/* ---------- viewer overlay ---------- */
.viewer {
  position: fixed; inset: 0; background: var(--paper);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.viewer.show { display: flex; }
.viewer-topbar {
  position: absolute; top: 0; left: 0; right: 0; padding: 20px 26px;
  display: flex; justify-content: space-between; align-items: flex-start;
  color: var(--ink); border-bottom: 0.5px solid var(--border);
  background: var(--paper);
}
.viewer-meta { display: flex; flex-direction: column; gap: 4px; max-width: 70%; }
.viewer-title {
  font-family: 'Noto Serif KR', serif; font-weight: 400; font-size: 14px;
  outline: none; cursor: text; border-bottom: 1px solid transparent; color: var(--ink);
}
.viewer-title:focus { border-bottom: 1px solid var(--border); }
.viewer-date { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.05em; color: var(--ink-faint); }
.icon-btn {
  background: none; border: none; color: var(--ink-mid); cursor: pointer;
  font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.05em;
  padding: 6px 8px; opacity: 0.75; transition: opacity 0.15s;
}
.icon-btn:hover { opacity: 1; }
.viewer-actions { display: flex; gap: 4px; }

.viewer-imgwrap {
  width: min(720px, 92vw); max-height: calc(100vh - 150px);
  overflow-y: auto; border-radius: 2px; -webkit-overflow-scrolling: touch;
}
.viewer-imgwrap img {
  width: 100%; height: auto; display: block; border-radius: 2px;
  box-shadow: 0 6px 24px var(--shadow), 0 1px 3px var(--shadow);
}

.nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--ink-faint); font-family: 'EB Garamond', serif;
  font-size: 34px; cursor: pointer; opacity: 0.7; padding: 10px 16px; transition: opacity 0.15s;
}
.nav-btn:hover { opacity: 1; }
.nav-prev { left: 4px; }
.nav-next { right: 4px; }
@media (max-width: 560px) {
  .nav-btn { font-size: 26px; padding: 8px; }
}

/* ---------- confirm delete ---------- */
.confirm-bar {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--paper); border-radius: 5px; padding: 14px 20px;
  display: none; flex-direction: column; align-items: center; gap: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25); width: min(280px, 84vw);
}
.confirm-bar.show { display: flex; }
.confirm-text { font-family: 'Noto Serif KR', serif; font-size: 12.5px; color: var(--ink-mid); text-align: center; line-height: 1.5; }
.confirm-btn-row { display: flex; gap: 22px; }
.confirm-yes, .confirm-no { white-space: nowrap; font-family: 'Inter', sans-serif; font-size: 11px; background: none; border: none; cursor: pointer; padding: 2px 4px; }
.confirm-yes { color: var(--ribbon); }
.confirm-no { color: var(--ink-faint); }

/* ---------- loading ---------- */
.loading-note {
  grid-column: 1 / -1; text-align: center; padding: 60px 0;
  font-family: 'Inter', sans-serif; font-size: 11px; color: var(--ink-faint);
  letter-spacing: 0.05em;
}

#fileInput { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">shelf.</div>
  <div class="tagline">이미지를 책처럼 모아두는 곳</div>
</header>

<div class="wrap">
  <div class="toolbar" id="toolbar">
    <button class="toolbar-btn" id="selectToggleBtn">선택</button>
    <button class="toolbar-btn" id="selectAllBtn" style="display:none;">전체 선택</button>
    <button class="toolbar-btn danger" id="deleteSelectedBtn" style="display:none;">삭제</button>
    <button class="toolbar-btn" id="cancelSelectBtn" style="display:none;">취소</button>
  </div>
  <div class="grid" id="grid">
    <div class="loading-note" id="loadingNote">불러오는 중…</div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple>

<!-- viewer -->
<div class="viewer" id="viewer">
  <div class="viewer-topbar">
    <div class="viewer-meta">
      <div class="viewer-title" id="viewerTitle" contenteditable="true" spellcheck="false"></div>
      <div class="viewer-date" id="viewerDate"></div>
    </div>
    <div class="viewer-actions">
      <button class="icon-btn" onclick="downloadCurrent()">저장</button>
      <button class="icon-btn" onclick="askDelete()">삭제</button>
      <button class="icon-btn" onclick="closeViewer()">닫기 ✕</button>
    </div>
  </div>

  <button class="nav-btn nav-prev" onclick="navViewer(-1)">‹</button>
  <div class="viewer-imgwrap" id="viewerImgWrap"><img id="viewerImg" alt=""></div>
  <button class="nav-btn nav-next" onclick="navViewer(1)">›</button>

  <div class="confirm-bar" id="confirmBar">
    <span class="confirm-text">이 이미지를 삭제할까요?</span>
    <div class="confirm-btn-row">
      <button class="confirm-yes" onclick="doDelete()">삭제</button>
      <button class="confirm-no" onclick="cancelDelete()">취소</button>
    </div>
  </div>
</div>

<script>
// ---------- Cloudinary config ----------
const CLOUD_NAME = 'fabryybg';
const UPLOAD_PRESET = 'Doneeee';
const API_KEY = '665912648183186';
const API_SECRET = 'cvVYUghBqmb';

let library = [];   // [{id, title, addedAt, url, publicId}]
let uploading = [];  // [{tempId, title}] - files currently uploading
let currentIndex = -1;
let selectMode = false;
let selected = new Set(); // ids currently checked

const grid = document.getElementById('grid');
const fileInput = document.getElementById('fileInput');

// The library index (titles, order, ids) is stored as a single JSON file
// on Cloudinary itself (as a 'raw' resource, uploaded via the same Upload
// API used for images/deletes — NOT the Admin API, which browsers can't
// call due to CORS preflight rejecting the auth header).
const INDEX_PUBLIC_ID = 'shelf_index';
const INDEX_URL = `https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/${INDEX_PUBLIC_ID}`;
// every uploaded image also gets this tag, as a recovery safety net in
// case the index file ever needs to be rebuilt from Cloudinary directly
const CLOUDINARY_TAG = 'shelf';

let indexLoaded = false;
let lastLoadError = '';

async function loadIndex() {
  try {
    const res = await fetch(`${INDEX_URL}?t=${Date.now()}`);
    if (res.ok) {
      library = await res.json();
      indexLoaded = true;
    } else if (res.status === 404) {
      library = [];
      indexLoaded = true;
    } else {
      library = [];
      indexLoaded = false;
      lastLoadError = 'HTTP ' + res.status;
    }
  } catch (e) {
    library = [];
    indexLoaded = false;
    lastLoadError = e.message || String(e);
  }
  library.sort((a, b) => b.addedAt - a.addedAt);
}

async function saveIndex() {
  if (!indexLoaded) return;
  const blob = new Blob([JSON.stringify(library)], { type: 'application/json' });
  const timestamp = Math.floor(Date.now() / 1000);
  const paramsToSign = `overwrite=true&public_id=${INDEX_PUBLIC_ID}&timestamp=${timestamp}${API_SECRET}`;
  const signature = await sha1Hex(paramsToSign);
  const fd = new FormData();
  fd.append('file', blob, INDEX_PUBLIC_ID);
  fd.append('public_id', INDEX_PUBLIC_ID);
  fd.append('overwrite', 'true');
  fd.append('timestamp', timestamp);
  fd.append('api_key', API_KEY);
  fd.append('signature', signature);
  try {
    await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, { method: 'POST', body: fd });
  } catch (e) {
    console.error('index sync failed', e);
  }
}

async function sha1Hex(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-1', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function cloudinaryUpload(blob, title) {
  const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
  const fd = new FormData();
  fd.append('file', blob);
  fd.append('upload_preset', UPLOAD_PRESET);
  fd.append('tags', CLOUDINARY_TAG);
  if (title) fd.append('context', `title=${String(title).replace(/[|=]/g, ' ')}`);
  const res = await fetch(url, { method: 'POST', body: fd });
  if (!res.ok) throw new Error('cloudinary upload failed');
  return res.json(); // { secure_url, public_id, ... }
}

async function cloudinaryDestroy(publicId) {
  const timestamp = Math.floor(Date.now() / 1000);
  const paramsToSign = `public_id=${publicId}&timestamp=${timestamp}${API_SECRET}`;
  const signature = await sha1Hex(paramsToSign);
  const fd = new FormData();
  fd.append('public_id', publicId);
  fd.append('timestamp', timestamp);
  fd.append('api_key', API_KEY);
  fd.append('signature', signature);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/destroy`, { method: 'POST', body: fd });
  return res.json();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

async function render() {
  grid.innerHTML = '';

  const addCard = document.createElement('div');
  addCard.className = 'card';
  addCard.innerHTML = `
    <div class="add-cover" id="addCover">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div class="add-plus">+</div>
        <div class="add-label">이미지 추가</div>
      </div>
    </div>`;
  grid.appendChild(addCard);
  addCard.querySelector('#addCover').onclick = () => fileInput.click();

  if (!indexLoaded) {
    const warn = document.createElement('div');
    warn.className = 'empty';
    warn.style.gridColumn = '1 / -1';
    warn.style.padding = '20px';
    warn.innerHTML = `<div class="empty-text">목록 동기화에 문제가 있어요. 지금 추가하는 사진은 이 화면엔 보이지만 다른 기기엔 아직 반영 안 될 수 있어요.<br><span style="font-family:'Inter',sans-serif;font-size:9px;opacity:0.7;">(${esc(lastLoadError || '알 수 없음')})</span></div>`;
    grid.appendChild(warn);
  }

  for (const u of uploading) {
    const upCard = document.createElement('div');
    upCard.className = 'card';
    upCard.innerHTML = `
      <div class="uploading-cover">
        <div class="spinner"></div>
        <div class="uploading-label">${esc(u.title)}</div>
      </div>
      <div class="cap">
        <div class="cap-title" style="color:var(--ink-faint)">업로드 중…</div>
      </div>`;
    grid.appendChild(upCard);
  }

  if (library.length === 0 && uploading.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<div class="empty-glyph">＋</div><div class="empty-text">아직 저장된 이미지가 없어요.<br>위의 + 를 눌러 첫 이미지를 담아보세요.</div>`;
    grid.appendChild(empty);
    return;
  }

  for (let i = 0; i < library.length; i++) {
    const item = library[i];
    const isChecked = selected.has(item.id);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cover${selectMode ? ' selecting' : ''}" data-idx="${i}">
        <div class="ribbon"></div>
        ${selectMode ? `<div class="select-check${isChecked ? ' checked' : ''}">${isChecked ? '✓' : ''}</div>` : ''}
        <img loading="lazy" alt="${esc(item.title)}">
      </div>
      <div class="cap">
        <div class="cap-title" contenteditable="true" spellcheck="false" data-id="${item.id}">${esc(item.title)}</div>
        <div class="cap-date">${fmtDate(item.addedAt)}</div>
      </div>`;
    grid.appendChild(card);

    const imgEl = card.querySelector('img');
    imgEl.src = thumbUrl(item.url);

    card.querySelector('.cover').addEventListener('click', () => {
      if (selectMode) { toggleSelect(item.id); } else { openViewer(i); }
    });

    const titleEl = card.querySelector('.cap-title');
    titleEl.addEventListener('blur', () => renameItem(item.id, titleEl.textContent.trim()));
    titleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
    });
    titleEl.addEventListener('click', (e) => e.stopPropagation());
  }

  updateToolbar();
}

function updateToolbar() {
  const selectToggleBtn = document.getElementById('selectToggleBtn');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
  const cancelSelectBtn = document.getElementById('cancelSelectBtn');

  if (!selectMode) {
    selectToggleBtn.style.display = library.length ? '' : 'none';
    selectAllBtn.style.display = 'none';
    deleteSelectedBtn.style.display = 'none';
    cancelSelectBtn.style.display = 'none';
  } else {
    selectToggleBtn.style.display = 'none';
    selectAllBtn.style.display = '';
    selectAllBtn.textContent = (selected.size === library.length && library.length > 0) ? '선택 해제' : '전체 선택';
    deleteSelectedBtn.style.display = '';
    deleteSelectedBtn.textContent = selected.size > 0 ? `삭제 (${selected.size})` : '삭제';
    deleteSelectedBtn.disabled = selected.size === 0;
    cancelSelectBtn.style.display = '';
  }
}

function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  render();
}

document.getElementById('selectToggleBtn').addEventListener('click', () => {
  selectMode = true;
  selected.clear();
  render();
});
document.getElementById('cancelSelectBtn').addEventListener('click', () => {
  selectMode = false;
  selected.clear();
  render();
});
document.getElementById('selectAllBtn').addEventListener('click', () => {
  if (selected.size === library.length && library.length > 0) {
    selected.clear();
  } else {
    library.forEach(item => selected.add(item.id));
  }
  render();
});
document.getElementById('deleteSelectedBtn').addEventListener('click', async () => {
  if (selected.size === 0) return;
  const ok = confirm(`선택한 ${selected.size}개 이미지를 삭제할까요? 되돌릴 수 없어요.`);
  if (!ok) return;
  const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
  deleteSelectedBtn.disabled = true;
  deleteSelectedBtn.textContent = '삭제 중…';
  const idsToDelete = Array.from(selected);
  for (const id of idsToDelete) {
    const item = library.find(x => x.id === id);
    if (item) {
      try { await cloudinaryDestroy(item.publicId); } catch (e) {}
    }
  }
  library = library.filter(x => !selected.has(x.id));
  selected.clear();
  selectMode = false;
  await saveIndex();
  render();
});

async function renameItem(id, newTitle) {
  if (!newTitle) newTitle = '제목 없음';
  const item = library.find(x => x.id === id);
  if (!item || item.title === newTitle) return;
  item.title = newTitle;
  await saveIndex();
}

// ---------- upload / compression ----------
fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  fileInput.value = '';
  for (const file of files) {
    const tempId = 'tmp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    uploading.push({ tempId, title: file.name });
    render();
    await addImage(file, tempId);
  }
});

async function addImage(file, tempId) {
  const title = file.name.replace(/\.[^.]+$/, '') || '제목 없음';
  const addedAt = Date.now();

  let uploadResult;
  try {
    uploadResult = await cloudinaryUpload(file, title);
  } catch (e) {
    uploading = uploading.filter(u => u.tempId !== tempId);
    render();
    alert('Cloudinary 업로드에 실패했습니다. (' + file.name + ')');
    return;
  }

  const id = uploadResult.public_id;
  library.unshift({ id, title, addedAt, url: uploadResult.secure_url, publicId: uploadResult.public_id });
  uploading = uploading.filter(u => u.tempId !== tempId);
  await saveIndex();
  render();
}

// Build a lightweight, cropped thumbnail URL for grid covers (keeps the
// grid fast to load) while the stored original / viewer stays full quality.
function thumbUrl(url) {
  return url.replace('/upload/', '/upload/c_fill,w_450,h_600,q_auto,f_auto/');
}

// ---------- viewer ----------
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const viewerTitle = document.getElementById('viewerTitle');
const viewerDate = document.getElementById('viewerDate');
const confirmBar = document.getElementById('confirmBar');

async function openViewer(idx) {
  currentIndex = idx;
  const item = library[idx];
  viewerTitle.textContent = item.title;
  viewerDate.textContent = fmtDate(item.addedAt);
  viewerImg.src = item.url;
  confirmBar.classList.remove('show');
  viewer.classList.add('show');
}

function closeViewer() {
  viewer.classList.remove('show');
  confirmBar.classList.remove('show');
}

function navViewer(dir) {
  if (currentIndex < 0) return;
  const next = currentIndex + dir;
  if (next < 0 || next >= library.length) return;
  openViewer(next);
}

viewerTitle.addEventListener('blur', () => {
  if (currentIndex < 0) return;
  const item = library[currentIndex];
  const newTitle = viewerTitle.textContent.trim();
  renameItem(item.id, newTitle).then(() => {
    const capTitle = document.querySelector(`.cap-title[data-id="${item.id}"]`);
    if (capTitle) capTitle.textContent = item.title;
  });
});
viewerTitle.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); viewerTitle.blur(); }
});

function downloadCurrent() {
  if (currentIndex < 0) return;
  const item = library[currentIndex];
  // Insert fl_attachment right after /upload/ so Cloudinary serves the file
  // with a Content-Disposition header, triggering a native download/save
  // prompt without needing a cross-origin fetch (which Safari often blocks).
  const filename = encodeURIComponent(item.title || 'image');
  const dlUrl = item.url.replace('/upload/', `/upload/fl_attachment:${filename}/`);
  window.open(dlUrl, '_blank');
}

function askDelete() { confirmBar.classList.add('show'); }
function cancelDelete() { confirmBar.classList.remove('show'); }

async function doDelete() {
  if (currentIndex < 0) return;
  const item = library[currentIndex];
  try {
    await cloudinaryDestroy(item.publicId);
  } catch (e) {
    alert('Cloudinary에서 삭제하지 못했습니다. 목록에서만 제거할게요.');
  }
  library.splice(currentIndex, 1);
  await saveIndex();
  confirmBar.classList.remove('show');
  closeViewer();
  render();
}

document.addEventListener('keydown', (e) => {
  if (!viewer.classList.contains('show')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') navViewer(-1);
  if (e.key === 'ArrowRight') navViewer(1);
});
viewer.addEventListener('click', (e) => {
  if (e.target === viewer) closeViewer();
});

// ---------- swipe to navigate ----------
const viewerImgWrap = document.getElementById('viewerImgWrap');
let touchStartX = 0, touchStartY = 0;
viewerImgWrap.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  touchStartX = t.screenX; touchStartY = t.screenY;
}, { passive: true });
viewerImgWrap.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.screenX - touchStartX;
  const dy = t.screenY - touchStartY;
  // only treat as a page-turn swipe if the motion is clearly horizontal
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (dx < 0) navViewer(1); else navViewer(-1);
  }
}, { passive: true });

// ---------- init ----------
(async function init() {
  await loadIndex();
  await render();
})();
</script>
